[project]
name = "palpite-milionario"
version = "2026.04.078"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.63.0",
    "reportlab>=4.4,<5",
    "pypdf>=6,<7",
]

[project.scripts]
palpite-milionario = "palpiteiro.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palpiteiro"]

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
